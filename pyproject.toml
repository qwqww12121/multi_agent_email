[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "four-text-v5"
version = "0.5.1"
description = "Role-driven native label scoring with independent evidence diagnostics"
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
model = ["transformers==4.57.1", "accelerate>=1.0", "lm-format-enforcer==0.11.3"]

[project.scripts]
four-text-v5 = "four_text_v5.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"four_text_v5.prompts" = ["common/*.txt", "roles/*/*.json"]
